<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTHOR STUDIO v0.1</title>
<style>
:root{
  --paper:#f4f0e8; --panel:#ebe6dc; --ink:#242321; --muted:#777168;
  --line:#c8c0b3; --accent:#4f6170; --soft:#ddd6ca; --white:#fbf9f4;
  --serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --sans:"Helvetica Neue","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{
  height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;background:rgba(244,240,232,.96);
  position:sticky;top:0;z-index:20
}
.brand{font-family:var(--serif);letter-spacing:.14em;font-size:14px}
.brand small{font:9px var(--sans);letter-spacing:.12em;color:var(--muted);margin-left:9px}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{
  border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px;
  border-radius:2px;font-size:12px
}
.btn:hover{background:var(--white)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.save-state{font-size:10px;color:var(--muted);margin-right:8px}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;min-height:calc(100vh - 58px)}
.sidebar,.inspector{background:var(--panel)}
.sidebar{border-right:1px solid var(--line);padding:22px 16px}
.inspector{border-left:1px solid var(--line);padding:22px 18px;overflow:auto}
.section-label{font-size:9px;letter-spacing:.16em;color:var(--muted);margin:0 0 12px}
.work-list{display:grid;gap:5px}
.work{
  border:0;background:transparent;text-align:left;padding:10px 9px;color:var(--ink);
  border-left:2px solid transparent
}
.work.active{background:rgba(255,255,255,.35);border-left-color:var(--accent)}
.work-title{font:14px var(--serif);margin-bottom:4px}
.work-meta{font-size:9px;color:var(--muted)}
.side-rule{border:0;border-top:1px solid var(--line);margin:22px 0}
.mini-nav button{width:100%;border:0;background:none;text-align:left;padding:8px 9px;color:var(--muted);font-size:11px}
.editor-area{min-width:0;padding:28px clamp(24px,5vw,74px) 80px}
.editor-head{max-width:800px;margin:0 auto 22px}
.title-input{
  width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;
  font:32px/1.4 var(--serif);padding:4px 0 12px;outline:none;color:var(--ink)
}
.title-input::placeholder{color:#a39c91}
.meta-line{display:flex;gap:14px;align-items:center;margin-top:11px;font-size:10px;color:var(--muted)}
.toolbar{
  max-width:800px;margin:0 auto 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap
}
.tool{
  border:1px solid transparent;background:transparent;padding:6px 8px;color:var(--muted);
  font-size:11px;border-radius:2px
}
.tool:hover{border-color:var(--line);color:var(--ink)}
.editor{
  display:block;width:100%;max-width:800px;min-height:62vh;margin:0 auto;border:0;outline:0;
  resize:vertical;background:transparent;color:var(--ink);font:17px/2.05 var(--serif);
  letter-spacing:.025em;padding:24px 2px;caret-color:var(--accent)
}
.editor::placeholder{color:#aaa397}
.bottom-status{
  max-width:800px;margin:16px auto 0;border-top:1px solid var(--line);padding-top:10px;
  display:flex;justify-content:space-between;font-size:9px;color:var(--muted);letter-spacing:.05em
}
.panel{margin-bottom:28px}
.panel h3{font:13px var(--serif);font-weight:500;margin:0 0 13px}
.field{margin-bottom:14px}
.field label{display:block;font-size:9px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);background:rgba(255,255,255,.28);
  padding:9px 10px;color:var(--ink);outline:none;border-radius:2px;font-size:11px
}
.field textarea{min-height:70px;resize:vertical}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  border:1px solid var(--line);background:transparent;padding:5px 8px;border-radius:20px;
  font-size:10px;color:var(--muted)
}
.tag.selected{background:var(--accent);border-color:var(--accent);color:white}
.tag-add{display:flex;gap:5px;margin-top:8px}
.tag-add input{min-width:0;flex:1}
.tag-add button{width:34px;border:1px solid var(--line);background:transparent}
.ruby-help{font:10px/1.7 var(--sans);color:var(--muted);margin-top:8px}
.preview-overlay{
  position:fixed;inset:58px 0 0;background:var(--paper);z-index:30;display:none
}
.preview-overlay.open{display:block}
.preview-top{
  height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 22px
}
.preview-controls{display:flex;gap:6px}
.preview-page{height:calc(100% - 48px);overflow:auto;padding:42px}
.preview-paper{max-width:760px;margin:auto;font:17px/2.1 var(--serif)}
.preview-paper h1{font-size:28px;font-weight:500;margin:0 0 34px}
.preview-paper p{margin:0;text-indent:1em}
.preview-paper p.dialogue{ text-indent:0 }
.preview-paper.vertical{
  writing-mode:vertical-rl;text-orientation:mixed;max-width:none;width:100%;
  height:calc(100vh - 190px);overflow-x:auto;overflow-y:hidden;padding:15px 36px
}
.preview-paper.vertical h1{margin:0 0 0 3em}
ruby rt{font-size:.52em}
.hide-reading ruby.reading rt{display:none}
.focus-mode .sidebar,.focus-mode .inspector,.focus-mode .editor-head,.focus-mode .toolbar{display:none}
.focus-mode .shell{display:block}
.focus-mode .editor-area{padding-top:7vh}
.focus-mode .editor{max-width:720px;min-height:78vh}
.focus-mode .topbar .top-actions>*{display:none}
.focus-mode .topbar .top-actions #focusBtn{display:inline-block}
.focus-mode .brand small{display:none}
.audio-pop{
  position:fixed;right:20px;bottom:20px;width:280px;background:var(--white);
  border:1px solid var(--line);padding:16px;z-index:40;display:none;box-shadow:0 8px 30px rgba(0,0,0,.08)
}
.audio-pop.open{display:block}
.audio-row{display:grid;grid-template-columns:80px 1fr 36px;gap:8px;align-items:center;margin:9px 0;font-size:10px}
.audio-row input{width:100%}
.modal{
  position:fixed;inset:0;background:rgba(30,29,27,.34);display:none;align-items:center;justify-content:center;z-index:60
}
.modal.open{display:flex}
.modal-card{width:min(480px,90vw);background:var(--paper);border:1px solid var(--line);padding:24px}
.modal-card h2{font:20px var(--serif);font-weight:500;margin:0 0 18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:1050px){
 .shell{grid-template-columns:190px minmax(0,1fr)}
 .inspector{display:none}
}
@media(max-width:720px){
 .shell{display:block}.sidebar{display:none}.editor-area{padding:22px 20px 70px}
 .title-input{font-size:27px}.topbar{padding:0 14px}.brand small{display:none}
 .top-actions .desktop-only{display:none}.editor{font-size:16px;line-height:2}
 .preview-page{padding:24px 18px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">AUTHOR STUDIO <small>PROTOTYPE 0.1</small></div>
  <div class="top-actions">
    <span id="saveState" class="save-state">保存済み</span>
    <button class="btn desktop-only" id="audioBtn">♪ 音</button>
    <button class="btn" id="previewBtn">プレビュー</button>
    <button class="btn" id="focusBtn">集中</button>
    <button class="btn primary desktop-only" id="exportBtn">書き出す</button>
  </div>
</header>

<main class="shell">
  <aside class="sidebar">
    <div class="section-label">MANUSCRIPTS</div>
    <div class="work-list">
      <button class="work active"><div class="work-title">無題の作品</div><div class="work-meta">執筆中 · 自動保存</div></button>
      <button class="work"><div class="work-title">＋ 新しい作品</div><div class="work-meta">NEW MANUSCRIPT</div></button>
    </div>
    <hr class="side-rule">
    <div class="section-label">STUDIO</div>
    <div class="mini-nav">
      <button>アイデア箱</button><button>資料庫</button><button>シリーズ</button>
      <button>タグ管理</button><button>版履歴</button><button>バックアップ</button>
    </div>
  </aside>

  <section class="editor-area">
    <div class="editor-head">
      <input id="title" class="title-input" placeholder="作品タイトル" value="">
      <div class="meta-line"><span id="statusText">執筆中</span><span>MASTER MANUSCRIPT</span><span id="lastSaved">—</span></div>
    </div>
    <div class="toolbar">
      <button class="tool" id="readingRubyBtn">読みルビ</button>
      <button class="tool" id="expressionRubyBtn">演出ルビ</button>
      <button class="tool" id="emphasisBtn">傍点</button>
      <button class="tool" id="dashBtn">――</button>
      <button class="tool" id="ellipsisBtn">……</button>
      <button class="tool" id="sceneBtn">＊ 場面転換</button>
      <button class="tool" id="consultBtn">◇ AI相談</button>
    </div>
    <textarea id="editor" class="editor" spellcheck="false" placeholder="ここから書き始める。

ルビ記法：
読み補助　｜珀鉛病《はくえんびょう》
演出　　　｜家族《ファミリー》{演}

本文は自動保存されます。"></textarea>
    <div class="bottom-status">
      <span id="count">0文字</span><span>原稿はこのブラウザ内に保存 · v0.1</span>
    </div>
  </section>

  <aside class="inspector">
    <section class="panel">
      <h3>作品情報</h3>
      <div class="field"><label>ステータス</label><select id="status"><option>アイデア</option><option>プロット</option><option selected>執筆中</option><option>初稿完成</option><option>推敲中</option><option>完成</option><option>Web公開済</option><option>書籍収録済</option></select></div>
      <div class="field"><label>シリーズ</label><input id="series" placeholder="シリーズを選択 / 新規入力"></div>
      <div class="field"><label>時系列</label><input id="timeline" placeholder="例：Dressrosa後"></div>
      <div class="field"><label>注意書き</label><textarea id="warning" placeholder="公開前に読者へ表示する内容"></textarea></div>
    </section>

    <section class="panel">
      <h3>タグ</h3>
      <div class="field"><label>人物</label><div class="tags" data-group="character"><button class="tag">ロー</button><button class="tag">ドフラミンゴ</button><button class="tag">コラソン</button><button class="tag">ベビー5</button></div><div class="tag-add"><input placeholder="新しい人物"><button>＋</button></div></div>
      <div class="field"><label>CP</label><div class="tags" data-group="pairing"><button class="tag">CPなし</button><button class="tag">ロドフ</button><button class="tag">鰐ドフ</button><button class="tag">ロシドフ</button></div><div class="tag-add"><input placeholder="新しいCP"><button>＋</button></div></div>
      <div class="field"><label>傾向・自由タグ</label><div class="tags" data-group="free"><button class="tag">原作補完</button><button class="tag">日常</button><button class="tag">シリアス</button><button class="tag">戦闘</button></div><div class="tag-add"><input placeholder="新しいタグ"><button>＋</button></div></div>
    </section>

    <section class="panel">
      <h3>作者メモ</h3>
      <div class="field"><textarea id="notes" placeholder="公開されないメモ。原作確認、続編案、改稿メモなど。"></textarea></div>
    </section>
  </aside>
</main>

<section id="preview" class="preview-overlay">
  <div class="preview-top">
    <div class="section-label" style="margin:0">READING PREVIEW</div>
    <div class="preview-controls">
      <button class="btn" id="rubyToggle">読みルビ：表示</button>
      <button class="btn" id="orientationBtn">縦書き</button>
      <button class="btn" id="closePreview">閉じる</button>
    </div>
  </div>
  <div class="preview-page"><article id="previewPaper" class="preview-paper"></article></div>
</section>

<div id="audioPop" class="audio-pop">
  <div style="display:flex;justify-content:space-between;align-items:center"><strong style="font:14px var(--serif)">執筆の音</strong><button class="tool" id="audioClose">×</button></div>
  <div class="audio-row"><span>Brown</span><input id="brownVol" type="range" min="0" max="100" value="0"><span id="brownNum">0</span></div>
  <div class="audio-row"><span>White</span><input id="whiteVol" type="range" min="0" max="100" value="0"><span id="whiteNum">0</span></div>
  <div class="ruby-help">ノイズはブラウザ内で生成。音源ファイルは使いません。</div>
</div>

<div id="rubyModal" class="modal">
 <div class="modal-card">
  <h2 id="rubyModalTitle">ルビを付ける</h2>
  <div class="field"><label>本文</label><input id="rubyBase"></div>
  <div class="field"><label>ルビ</label><input id="rubyText" placeholder="読み / 演出語"></div>
  <div class="ruby-help" id="rubyDesc"></div>
  <div class="modal-actions"><button class="btn" id="rubyCancel">キャンセル</button><button class="btn primary" id="rubyApply">挿入</button></div>
 </div>
</div>

<div id="exportModal" class="modal">
 <div class="modal-card">
  <h2>書き出す</h2>
  <p class="ruby-help">v0.1では、原稿を持ち出せることを優先して TXT / Markdown / JSON を実装。DOCXと紙面組版は次段階で追加します。</p>
  <div style="display:grid;gap:8px;margin-top:16px">
   <button class="btn" data-export="txt">TXT — 本文</button>
   <button class="btn" data-export="md">Markdown — ルビ記法を保持</button>
   <button class="btn" data-export="json">JSON — タグ・メモを含む完全データ</button>
  </div>
  <div class="modal-actions"><button class="btn" id="exportClose">閉じる</button></div>
 </div>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const editor=$("#editor"), title=$("#title"), saveState=$("#saveState"), count=$("#count");
const fields=["title","editor","status","series","timeline","warning","notes"];
const KEY="authorStudio.v01";
let rubyMode="reading", audioCtx=null, brownNode=null, whiteNode=null, gains={};

function getData(){
 const tags={}; $$(".tags").forEach(g=>tags[g.dataset.group]=[...g.querySelectorAll(".tag.selected")].map(x=>x.textContent));
 return {version:1,title:title.value,body:editor.value,status:$("#status").value,series:$("#series").value,
 timeline:$("#timeline").value,warning:$("#warning").value,notes:$("#notes").value,tags,updatedAt:new Date().toISOString()};
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(getData()));
 saveState.textContent="保存済み"; $("#lastSaved").textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}
let timer;
function dirty(){saveState.textContent="保存中…"; clearTimeout(timer); timer=setTimeout(save,450); updateCount();}
function load(){
 const raw=localStorage.getItem(KEY); if(!raw){updateCount();return}
 try{
  const d=JSON.parse(raw);
  title.value=d.title||""; editor.value=d.body||""; $("#status").value=d.status||"執筆中";
  $("#series").value=d.series||""; $("#timeline").value=d.timeline||""; $("#warning").value=d.warning||""; $("#notes").value=d.notes||"";
  Object.entries(d.tags||{}).forEach(([group,vals])=>{
   const box=document.querySelector(`.tags[data-group="${group}"]`);
   (vals||[]).forEach(v=>{
    let b=[...box.querySelectorAll(".tag")].find(x=>x.textContent===v);
    if(!b){b=document.createElement("button");b.className="tag";b.textContent=v;box.appendChild(b)}
    b.classList.add("selected");
   })
  });
 }catch(e){}
 updateCount();
}
function updateCount(){count.textContent=editor.value.replace(/\s/g,"").length.toLocaleString()+"文字"; $("#statusText").textContent=$("#status").value}
fields.forEach(id=>$("#"+id).addEventListener(id==="status"?"change":"input",dirty));
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save()}});

document.addEventListener("click",e=>{
 if(e.target.classList.contains("tag")){e.target.classList.toggle("selected");dirty()}
 if(e.target.closest(".tag-add") && e.target.tagName==="BUTTON"){
  const row=e.target.closest(".tag-add"), inp=row.querySelector("input"), val=inp.value.trim();
  if(val){const b=document.createElement("button");b.className="tag selected";b.textContent=val;row.previousElementSibling.appendChild(b);inp.value="";dirty()}
 }
});

function insertText(t){
 const s=editor.selectionStart,e=editor.selectionEnd; editor.setRangeText(t,s,e,"end"); editor.focus(); dirty();
}
$("#dashBtn").onclick=()=>insertText("――");
$("#ellipsisBtn").onclick=()=>insertText("……");
$("#sceneBtn").onclick=()=>insertText("\n\n＊\n\n");
$("#emphasisBtn").onclick=()=>{
 const s=editor.selectionStart,e=editor.selectionEnd,sel=editor.value.slice(s,e);
 if(!sel)return; editor.setRangeText(`《《${sel}》》`,s,e,"end");dirty()
};

function openRuby(mode){
 rubyMode=mode; const s=editor.selectionStart,e=editor.selectionEnd;
 $("#rubyBase").value=editor.value.slice(s,e); $("#rubyText").value="";
 $("#rubyModalTitle").textContent=mode==="reading"?"読み補助ルビ":"演出ルビ";
 $("#rubyDesc").textContent=mode==="reading"?"読者設定で非表示にできる読み方の補助。":"作品表現として常時表示されるルビ。";
 $("#rubyModal").classList.add("open"); setTimeout(()=>$("#rubyText").focus(),50)
}
$("#readingRubyBtn").onclick=()=>openRuby("reading");
$("#expressionRubyBtn").onclick=()=>openRuby("expression");
$("#rubyCancel").onclick=()=>$("#rubyModal").classList.remove("open");
$("#rubyApply").onclick=()=>{
 const base=$("#rubyBase").value.trim(), rt=$("#rubyText").value.trim(); if(!base||!rt)return;
 const mark=rubyMode==="reading"?`｜${base}《${rt}》`:`｜${base}《${rt}》{演}`;
 const s=editor.selectionStart,e=editor.selectionEnd; editor.setRangeText(mark,s,e,"end");
 $("#rubyModal").classList.remove("open");editor.focus();dirty()
};

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderInline(s){
 s=escapeHtml(s);
 s=s.replace(/｜([^《\n]+)《([^》\n]+)》\{演\}/g,'<ruby class="expression">$1<rt>$2</rt></ruby>');
 s=s.replace(/｜([^《\n]+)《([^》\n]+)》/g,'<ruby class="reading">$1<rt>$2</rt></ruby>');
 s=s.replace(/《《([^》\n]+)》》/g,'<span style="text-emphasis:filled dot;-webkit-text-emphasis:filled dot">$1</span>');
 return s;
}
function renderPreview(){
 const lines=editor.value.split(/\n/), html=[];
 html.push(`<h1>${escapeHtml(title.value||"無題の作品")}</h1>`);
 lines.forEach(line=>{
  if(!line.trim()){html.push('<p style="height:1em"></p>');return}
  const cls=/^[「『]/.test(line.trim())?"dialogue":"";
  html.push(`<p class="${cls}">${renderInline(line)}</p>`)
 });
 $("#previewPaper").innerHTML=html.join("");
}
$("#previewBtn").onclick=()=>{renderPreview();$("#preview").classList.add("open")};
$("#closePreview").onclick=()=>$("#preview").classList.remove("open");
$("#orientationBtn").onclick=()=>{
 const p=$("#previewPaper");p.classList.toggle("vertical");
 $("#orientationBtn").textContent=p.classList.contains("vertical")?"横書き":"縦書き";
};
$("#rubyToggle").onclick=()=>{
 const p=$("#previewPaper");p.classList.toggle("hide-reading");
 $("#rubyToggle").textContent=p.classList.contains("hide-reading")?"読みルビ：非表示":"読みルビ：表示";
};

$("#focusBtn").onclick=()=>{
 document.body.classList.toggle("focus-mode");
 $("#focusBtn").textContent=document.body.classList.contains("focus-mode")?"集中を終了":"集中";
 editor.focus();
};
$("#consultBtn").onclick=()=>alert("AI相談パネルは次段階で接続予定です。原稿・資料庫・作品履歴を参照する編集者モードを想定しています。");

$("#audioBtn").onclick=()=>$("#audioPop").classList.toggle("open");
$("#audioClose").onclick=()=>$("#audioPop").classList.remove("open");
function ensureAudio(){
 if(audioCtx)return;
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 function noise(kind){
  const size=audioCtx.sampleRate*2, buf=audioCtx.createBuffer(1,size,audioCtx.sampleRate), data=buf.getChannelData(0);
  if(kind==="white"){for(let i=0;i<size;i++)data[i]=Math.random()*2-1}
  else{let last=0;for(let i=0;i<size;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;data[i]=last*3.5}}
  const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
  const gain=audioCtx.createGain();gain.gain.value=0;src.connect(gain).connect(audioCtx.destination);src.start();
  gains[kind]=gain;
 }
 noise("brown");noise("white");
}
["brown","white"].forEach(k=>{
 $("#"+k+"Vol").addEventListener("input",e=>{
  ensureAudio(); const v=+e.target.value; $("#"+k+"Num").textContent=v; gains[k].gain.setTargetAtTime(v/500,audioCtx.currentTime,.03)
 })
});

$("#exportBtn").onclick=()=>$("#exportModal").classList.add("open");
$("#exportClose").onclick=()=>$("#exportModal").classList.remove("open");
$$("[data-export]").forEach(b=>b.onclick=()=>{
 const d=getData(), type=b.dataset.export; let content="",mime="text/plain",ext=type;
 if(type==="txt") content=(d.title?d.title+"\n\n":"")+d.body;
 if(type==="md") content="# "+(d.title||"無題")+"\n\n"+d.body;
 if(type==="json"){content=JSON.stringify(d,null,2);mime="application/json"}
 const blob=new Blob([content],{type:mime+";charset=utf-8"}), a=document.createElement("a");
